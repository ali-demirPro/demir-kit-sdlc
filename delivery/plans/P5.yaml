  commit: d61c8e46a12110af7fbd92c40c91df17fb66fa92
  read_at: "2026-11-10"
  plan: delivery/plans/P5.yaml
  files:
    - docs/specs/security.md
    - docs/specs/registry-v2.md
    - docs/specs/registry.md
    - docs/specs/publication.md
    - docs/specs/discovery.md
