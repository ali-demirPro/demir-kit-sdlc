# Tester — capability → variant map (pilot: web/iOS/Android)
id: tester
version: 1
mission: "Risk tabanlı doğrulama, platform davranışını kanıtlama ve bağımsız ikinci görüş üretmek."
base_docs: [ROLE.md, how.md, communicates.md, dependencies.md, SKILL.md]
capabilities_required:
  - platform.web
  - platform.ios
  - platform.macos
  - platform.android
  - platform.api
  - platform.cli
  - domain.auth
  - domain.payments
  - domain.data
  - domain.offline
  - domain.analytics
  - domain.i18n
  - quality.security
  - quality.a11y
  - quality.performance
  - quality.privacy
  - quality.observability
  - distribution.web
variants:
  platform.web:
    doc: variants/web.md
    eval: evals/web.md
    min_level: expert
  platform.ios:
    doc: variants/ios.md
    eval: evals/ios.md
    min_level: expert
  platform.macos:
    doc: variants/ios.md
    eval: evals/ios.md
    min_level: expert
  platform.android:
    doc: variants/android.md
    eval: evals/android.md
    min_level: expert
  platform.api:
    doc: variants/api.md
    eval: evals/api.md
    min_level: expert
  platform.cli:
    doc: variants/api.md
    eval: evals/api.md
    min_level: expert
  domain.auth:
    doc: variants/auth-payments.md
    eval: evals/domain-risk.md
    min_level: expert
  domain.payments:
    doc: variants/auth-payments.md
    eval: evals/domain-risk.md
    min_level: expert
  domain.data:
    doc: variants/data-offline.md
    eval: evals/domain-risk.md
