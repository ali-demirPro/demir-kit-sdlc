# Product ecosystem. Replace paths/stacks/commands with the real repo.
name: product

products:
  app:
    description: Web application
    surfaces:
      web:
        path: .
        stacks: [next]
        platforms: [web]
        hosts: [app]
        gates:
          behavior: "./scripts/gate-behavior.sh {checkpoint}"
          behavior_mode: headless
          ui: true
          ui_compare: none

tracker:
  provider: github
  repo: OWNER/REPO
