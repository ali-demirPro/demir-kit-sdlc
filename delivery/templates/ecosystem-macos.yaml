# macOS surface contract — kopyala, name/tracker/product adını ve yolları düzelt.
# Kanıt komutları: behavior zorunlu; selftest/snapshot beklenir. snapshot yoksa
# ui_compare'ı none bırak (uyarı) veya tarihli ui_waiver ekle (aşağıda).
name: MacApp
products:
  app:
    description: "macOS uygulaması (SwiftUI)."
    surfaces:
      macos.app:
        path: Sources
        stacks: [swiftui, swift]
        platforms: [macos]
        gates:
          behavior: "./build.sh && ./tools/selftest.sh {checkpoint}"
          behavior_mode: headless
          selftest: "./tools/selftest.sh"
          snapshot: "./tools/snap.sh"
          snapshot_pages: [main, settings]
          ui: true
          ui_compare: screenshot
          # snapshot henüz yoksa geçiş için tarihli muafiyet (süre dolunca hata):
          # ui_waiver: { reason: "snapshot araci hazirlaniyor", until: "2026-12-15", issue: 12 }

tracker:
  provider: github
  repo: owner/repo
