name: delivery-doctor

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: doctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check "pyyaml==6.*"
      - name: Doctor unit tests
        run: python3 -m unittest discover -s delivery/tests -v
      - name: Contract doctor (strict)
        run: bash ./delivery/scripts/doctor.sh --strict
